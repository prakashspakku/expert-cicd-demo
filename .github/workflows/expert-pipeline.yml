name: Expert CI-CD Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch: # Allows you to trigger the run manually

permissions:
  contents: read # Secure: The runner can read code but not change your repo

jobs:
  build_package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Test
        run: echo "Performing professional build and security audit..."
      - name: Create Artifact
        run: |
          mkdir dist
          echo "Production Ready Build" > dist/index.html
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  deploy_prod:
    needs: build_package
    environment: production # Triggers the manual approval rule you set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
      - name: Final Release
        run: echo "Deploying to production after human approval!"
